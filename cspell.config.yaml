version: "0.2"
language: en
ignorePaths:
  - benchmarks/results
  - docs/_build
ignoreRegExpList:
  # Escaped bytes in byte strings, e.g. \x0cjunk.
  - /\\x[0-9a-fA-F]{2}/g
dictionaries:
  - project-words
dictionaryDefinitions:
  - name: project-words
    path: ./project-words.txt
    addWords: true
