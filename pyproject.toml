[project]
name = "x690"
version = "2.0.0"
description = "Pure-Python ASN.1 BER encoder and decoder with typed values, light on memory for large documents"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["x690", "x.690", "ber", "der", "asn1", "asn.1", "snmp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "t61codec>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/exhuma/x690"
Repository = "https://github.com/exhuma/x690"
Documentation = "https://exhuma.github.io/x690/"
Changelog = "https://exhuma.github.io/x690/changelog.html"
Issues = "https://github.com/exhuma/x690/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x690"]

[tool.hatch.build.targets.sdist]
include = ["/x690", "/tests", "/docs", "/README.rst", "/LICENSE.txt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=2.0",
    "michel-albert-sphinx @ git+https://github.com/exhuma/michel-albert-sphinx@v0.4.0",
    "Pygments>=2.17",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
bench = [
    "asn1crypto>=1.5",
    "asn1tools>=0.169",
    "pyasn1>=0.6",
    "pycrate>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "x690", "docs", "README.rst"]
norecursedirs = ["docs/_build"]
addopts = [
    "--cov=x690",
    "--cov-report=term-missing",
    "--cov-fail-under=99",
    "--doctest-modules",
    "--doctest-glob=*.rst",
]

[tool.mypy]
strict = true
files = ["x690", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 80
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-select = ["G", "LOG", "TRY400", "T20"]
ignore = [
    "E501",
    "UP031",  # printf-style formatting is kept to avoid behaviour changes
    "UP042",  # (str, Enum) is kept: StrEnum would change str()/format()
    "B905",   # zip(strict=...) would change behaviour
]

[tool.ruff.lint.isort]
known-first-party = ["x690"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["T201"]
